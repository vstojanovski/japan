<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kakeibo">
<meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f100e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.json">
<!-- page content starts here -->
<title>Kakeibo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
:root {
  --page: #f4f5f1;
  --surface: #fcfcfb;
  --surface-2: #eeefea;
  --ink: #111210;
  --ink-2: #52514e;
  --muted: #7d7c76;
  --line: #e3e4dd;
  --grid: #e8e8e2;
  --axis: #c3c2b7;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42,120,214,.10);
  --track: #dbe8f8;
  --s1: #2a78d6;
  --s2: #eb6834;
  --good: #0ca30c;
  --good-text: #006300;
  --warn: #fab219;
  --warn-text: #8a5a00;
  --bad: #d03b3b;
  --bad-text: #b02a2a;
  --stamp: #c8412f;
  --shadow: 0 1px 2px rgba(17,18,16,.04), 0 4px 16px rgba(17,18,16,.04);
  --ring: rgba(11,11,11,.10);
  color-scheme: light;
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0f100e; --surface: #1a1a19; --surface-2: #242422; --ink: #f5f5f0; --ink-2: #c3c2b7; --muted: #8f8e87;
    --line: #2c2c2a; --grid: #2a2a28; --axis: #3d3d3a; --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57,135,229,.14);
    --track: #1d3350; --s1: #3987e5; --s2: #d95926; --good-text: #3cc13c; --warn-text: #fab219; --bad-text: #ef7070; --stamp: #e0604d;
    --shadow: none; --ring: rgba(255,255,255,.10); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0f100e; --surface: #1a1a19; --surface-2: #242422; --ink: #f5f5f0; --ink-2: #c3c2b7; --muted: #8f8e87;
  --line: #2c2c2a; --grid: #2a2a28; --axis: #3d3d3a; --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57,135,229,.14);
  --track: #1d3350; --s1: #3987e5; --s2: #d95926; --good-text: #3cc13c; --warn-text: #fab219; --bad-text: #ef7070; --stamp: #e0604d;
  --shadow: none; --ring: rgba(255,255,255,.10); color-scheme: dark;
}
* { box-sizing: border-box }
html, body { margin: 0 }
body {
  background: var(--page); color: var(--ink);
  font: 15px/1.5 Figtree, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit }
a { color: var(--accent-ink) }
.num { font-variant-numeric: tabular-nums }
[hidden] { display: none !important }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0,1fr); min-height: 100vh }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh;
  padding: 22px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 22px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px }
.hanko {
  width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--stamp); color: var(--stamp);
  display: grid; place-items: center; font: 600 15px/1 "Hiragino Mincho ProN", "Yu Mincho", serif; transform: rotate(-4deg);
}
.brand b { font: 600 20px/1 Fraunces, Georgia, serif; letter-spacing: -.01em }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px;
  color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap;
}
.nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.nav a:hover { background: var(--surface-2); color: var(--ink) }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); outline: 1px solid var(--line) }
.side-foot { margin-top: auto; padding: 0 10px; color: var(--muted); font-size: 12.5px; line-height: 1.45 }
main { min-width: 0 }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 28px; padding-block: 26px 60px }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0,1fr) }
  .side {
    position: sticky; z-index: 20; height: auto; flex-direction: row; align-items: center; gap: 12px;
    padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); background: var(--page);
  }
  .brand { padding: 0 }
  .brand b { display: none }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 2px; margin-right: -16px; padding-right: 16px }
  .nav::-webkit-scrollbar { display: none }
  .nav a { padding: 7px 10px; font-size: 14px }
  .nav a svg { display: none }
  .side-foot { display: none }
  .wrap { padding-inline: 16px; padding-block: 18px 48px }
}

/* ---------- page header ---------- */
.ph { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px }
.ph h1 { font: 600 28px/1.15 Fraunces, Georgia, serif; letter-spacing: -.015em; margin: 0; text-wrap: balance }
.ph .sp { flex: 1 }
.monthnav { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px }
.monthnav span { min-width: 118px; text-align: center; font-weight: 600 }
.iconbtn { width: 32px; height: 30px; border: 0; background: transparent; border-radius: 7px; cursor: pointer; display: grid; place-items: center; color: var(--ink-2) }
.iconbtn:hover { background: var(--surface-2); color: var(--ink) }
.iconbtn:disabled { opacity: .35; cursor: default; background: transparent }

.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; white-space: nowrap; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--axis) }
.btn.primary { background: var(--ink); color: var(--page); border-color: var(--ink) }
.btn.primary:hover { opacity: .88 }
.btn.danger { color: var(--bad-text) }
.btn.small { padding: 5px 10px; font-size: 13px }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-ink) }
.btn.ghost:hover { background: var(--accent-wash) }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 600; cursor: pointer; font-size: 13.5px; text-decoration: none }
.linkbtn:hover { text-decoration: underline }

/* ---------- banner ---------- */
.banner {
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 18px;
  padding: 12px 16px; border-radius: 12px; background: var(--accent-wash); color: var(--ink);
}
.banner p { margin: 0; flex: 1 1 280px }
.banner .acts { display: flex; gap: 8px; flex-wrap: wrap }

/* ---------- cards & grid ---------- */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 16px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); min-width: 0 }
.c12 { grid-column: span 12 } .c8 { grid-column: span 8 } .c7 { grid-column: span 7 } .c6 { grid-column: span 6 } .c5 { grid-column: span 5 } .c4 { grid-column: span 4 }
@media (max-width: 1080px) { .c8, .c7, .c6, .c5 { grid-column: span 12 } .c4 { grid-column: span 6 } }
@media (max-width: 620px) { .c4 { grid-column: span 12 } .card { padding: 16px } }
.ch { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px }
.ch h2 { font-size: 15px; font-weight: 700; margin: 0 }
.ch .sub { color: var(--muted); font-size: 13px }
.ch .sp { flex: 1 }

.lbl { color: var(--ink-2); font-size: 13.5px; font-weight: 500 }
.hero { font-size: 44px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; margin: 4px 0 6px }
.tile .val { font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin: 4px 0 4px }
.delta { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px }
.delta.up { color: var(--good-text) } .delta.down { color: var(--bad-text) } .delta.flat { color: var(--muted) }
.muted { color: var(--muted) }
.small { font-size: 13px }
.row-flex { display: flex; gap: 18px; flex-wrap: wrap; align-items: baseline }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; min-height: 120px }
.chart svg { display: block; width: 100%; height: auto; overflow: visible }
.chart text { fill: var(--muted); font-size: 11.5px; font-family: inherit; font-variant-numeric: tabular-nums }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2) }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px }
#tip {
  position: fixed; z-index: 60; pointer-events: none; min-width: 150px; max-width: 260px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 6px 24px rgba(0,0,0,.12); padding: 9px 11px; font-size: 13px;
}
#tip .h { color: var(--ink-2); font-weight: 600; margin-bottom: 4px }
#tip .r { display: flex; align-items: center; gap: 8px; line-height: 1.7 }
#tip .r i { width: 12px; height: 2px; border-radius: 2px; flex: none }
#tip .r b { margin-right: auto; font-variant-numeric: tabular-nums }
#tip .r span { color: var(--ink-2) }

/* horizontal bars (category breakdown) */
.hbars { display: flex; flex-direction: column; gap: 9px }
.hbar { display: grid; grid-template-columns: minmax(0, 11em) minmax(0,1fr) auto; gap: 12px; align-items: center; font-size: 14px }
.hbar .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.hbar .tr { height: 10px; border-radius: 0 4px 4px 0; position: relative }
.hbar .tr b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px }
.hbar.inc .tr b { background: var(--good) }
.hbar .v { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 5.5em; text-align: right }
.hbar:hover .tr b { filter: brightness(1.12) }
@media (max-width: 520px) { .hbar { grid-template-columns: minmax(0, 8.5em) minmax(0,1fr) auto } }

/* meters (budgets) */
.meter { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden }
.meter b { display: block; height: 100%; border-radius: 4px; background: var(--accent) }
.meter.warn b { background: var(--warn) }
.meter.over b { background: var(--bad) }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap }
.pill.ok { color: var(--ink-2); background: var(--surface-2) }
.pill.warn { color: var(--warn-text); background: rgba(250,178,25,.16) }
.pill.over { color: var(--bad-text); background: rgba(208,59,59,.12) }
.pill.good { color: var(--good-text); background: rgba(12,163,12,.12) }

.brow { display: grid; grid-template-columns: minmax(0, 13em) minmax(0,1fr) auto; gap: 8px 16px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line) }
.brow:first-child { border-top: 0 }
.brow .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.brow .fig { font-size: 13px; color: var(--ink-2); margin-top: 5px }
.brow .bin { display: flex; align-items: center; gap: 6px; justify-content: flex-end }
.brow input { width: 96px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--page); text-align: right; font-variant-numeric: tabular-nums }
@media (max-width: 620px) {
  .brow { grid-template-columns: minmax(0,1fr) auto }
  .brow .mid { grid-column: 1 / -1; order: 3 }
}
.grp-h { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 2px }
.grp-h:first-child { margin-top: 0 }

/* ---------- lists ---------- */
.list { display: flex; flex-direction: column }
.li { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line) }
.li:first-child { border-top: 0 }
.emo { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 17px }
.li .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.li .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.amt { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap }
.amt.pos { color: var(--good-text) }

/* transactions */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px }
.filters input, .filters select, .field input, .field select, .field textarea {
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); min-width: 0;
}
.filters input[type="search"] { flex: 1 1 220px }
.filters select { flex: 0 1 190px }
.dayh { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 14px 4px 6px; border-bottom: 1px solid var(--line) }
.tx { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer }
.tx:hover { background: var(--surface-2) }
.tx .d { min-width: 0 }
.tx .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tx .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tx select { width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); cursor: pointer; text-overflow: ellipsis }
.tx select:hover { border-color: var(--line) }
@media (max-width: 620px) {
  .tx { grid-template-columns: minmax(0,1fr) auto }
  .tx .c { grid-column: 1 / -1; order: 3 }
}
.empty { text-align: center; padding: 40px 12px; color: var(--muted) }

/* tables */
.tbl-wrap { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 14px }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums }
th:first-child, td:first-child { text-align: left }
th { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em }
tr.sel td { background: var(--accent-wash) }
tbody tr { cursor: default }
details.tbl summary { cursor: pointer; color: var(--accent-ink); font-weight: 600; font-size: 13.5px; margin-top: 12px }

/* insights */
.ins { display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 0; list-style: none }
.ins li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14.5px; line-height: 1.45 }
.ins li .ic { font-weight: 700; text-align: center }
.ins .ic.up { color: var(--bad-text) } .ins .ic.dn { color: var(--good-text) } .ins .ic.nt { color: var(--accent-ink) }
.kq { margin: 0; padding-left: 20px; color: var(--ink-2); font-size: 13.5px; display: grid; gap: 3px }
textarea.note { width: 100%; min-height: 120px; resize: vertical; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--page); line-height: 1.5; margin-top: 10px }

/* ---------- dialog ---------- */
dialog {
  border: 1px solid var(--line); border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink);
  width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(10,10,8,.42) }
.dlg { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px }
.dlg h3 { margin: 0; font: 600 21px/1.2 Fraunces, Georgia, serif }
.dlg p { margin: 0; color: var(--ink-2) }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0 }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2) }
.field input, .field select, .field textarea { background: var(--page); width: 100% }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.fields .full { grid-column: 1 / -1 }
@media (max-width: 520px) { .fields { grid-template-columns: 1fr } }
.dlg-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px }
.dlg-foot .sp { flex: 1 }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px }
.preview { font-size: 13px }
.preview td, .preview th { padding: 5px 8px }
.dropzone { border: 1.5px dashed var(--axis); border-radius: 12px; padding: 22px; text-align: center; color: var(--ink-2); display: block; cursor: pointer }
.dropzone.drag { border-color: var(--accent); background: var(--accent-wash) }
.dropzone input { display: block; margin: 10px auto 0 }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 80;
  background: var(--ink); color: var(--page); padding: 10px 14px; border-radius: 11px; display: flex; gap: 14px; align-items: center;
  font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.25);
}
#toast button { background: none; border: 0; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; white-space: nowrap }

/* settings */
.set-row { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap }
.set-row:first-of-type { border-top: 0 }
.set-row .tx2 { flex: 1 1 260px }
.set-row .tx2 b { display: block }
.set-row .tx2 span { color: var(--muted); font-size: 13.5px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 99px; background: var(--surface-2); font-size: 13.5px }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; font-size: 15px; line-height: 1 }
.chip button:hover { color: var(--bad-text) }

@media (prefers-reduced-motion: no-preference) {
  .meter b, .hbar .tr b { transition: width .35s ease }
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="hanko" aria-hidden="true">家</span><b>Kakeibo</b></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">Your data stays in this browser. Nothing is uploaded.</div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<div id="tip" hidden></div>
<div id="toast" hidden></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ===================================================================
   Kakeibo — a local-first personal finance dashboard.
   All data lives in localStorage under one key; nothing leaves the device.
   =================================================================== */

const LS_KEY = "kakeibo.v1";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const TODAY = ymd(new Date());
const CUR_MONTH = TODAY.slice(0, 7);
const sum = a => a.reduce((x, y) => x + y, 0);
const median = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const round2 = n => Math.round(n * 100) / 100;

function addMonths(ym, k) { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + "-" + pad(m); }
function daysIn(ym) { const [y, m] = ym.split("-").map(Number); return new Date(y, m, 0).getDate(); }
function monthEnd(ym) { return ym + "-" + pad(daysIn(ym)); }
function addDays(s, k) { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + k); return ymd(d); }
function dayDiff(a, b) { return Math.round((new Date(b + "T12:00:00") - new Date(a + "T12:00:00")) / 864e5); }
function nextMonthSameDay(s) { const ym = addMonths(s.slice(0, 7), 1); return ym + "-" + pad(Math.min(+s.slice(8), daysIn(ym))); }

function detectRecurring() {
  const groups = {};

    if (groupOf(t.category) === "Transfers") continue;

    const diffs = []; for (let i = 1; i < list.length; i++) diffs.push(dayDiff(list[i - 1].date, list[i].date));

    if (!f) continue;
    // Paid on the same two days each month (e.g. the 1st and 15th) reads as twice a month, not every two weeks.
    if (f.id === "biweekly" && new Set(list.slice(-8).map(t => t.date.slice(8))).size <= 2) f = TWICE_MONTHLY;
    if (diffs.filter(d => Math.abs(d - md) <= Math.max(3, md * 0.25)).length / diffs.length < 0.7) continue;
    const amts = list.map(t => Math.abs(t.amount)), ma = median(amts);

    let next = f.id === "monthly" ? nextMonthSameDay(last.date) : addDays(last.date, Math.round(md));

    }
    const sign = last.amount < 0 ? -1 : 1;
    out.push({ key, name: titleCase(merchantKey(last.desc)), category: last.category, freq: f, amount: sign * ma, lastAmount: last.amount,
      last: last.date, next, monthly: sign * ma * f.perMonth, count: list.length });
  }
  return out.sort((a, b) => a.next < b.next ? -1 : 1);
}

/* ---------- categorization ---------- */
function categorize(desc, amount) {
  const k = merchantKey(desc);
  const r = S.rules.find(r => r.key === k);
  if (r && CM[r.category]) return r.category;

  const svg = el.firstChild, hov = svg.querySelector(".hov"), hit = svg.querySelector(".hit");
  const move = ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(li, Math.round(pts.length === 1 ? 0 : (x - m.l) / iw * (pts.length - 1))));
    hov.style.display = ""; hov.firstElementChild.setAttribute("x1", X(i)); hov.firstElementChild.setAttribute("x2", X(i));
    hov.lastElementChild.setAttribute("cx", X(i)); hov.lastElementChild.setAttribute("cy", Y(pts[i].v));
    showTip(`<div class="h">${esc(pts[i].title || pts[i].label)}</div>` + tipRow("var(--s1)", esc(money(pts[i].v)), opt.series || "Value"), ev);
  };
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hov.style.display = "none"; hideTip(); });
}

function colPath(x, y, w, h, r) {
  if (h <= 0) return "";
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}L${x},${y + r}Q${x},${y} ${x + r},${y}L${x + w - r},${y}Q${x + w},${y} ${x + w},${y + r}L${x + w},${y + h}Z`;
}
// Grouped columns: income (s1) vs spending (s2) per month.
function cashChart(el, rows, opt = {}) {
  if (!el || !rows.length) return;
  const W = Math.max(260, el.clientWidth), H = opt.h || 230, m = { t: 12, r: 8, b: 26, l: 54 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = rows.length, band = iw / n;
  const hi = Math.max(1, ...rows.map(r => Math.max(r.income, r.expense)));
  const ticks = niceTicks(0, hi, 4), y1 = ticks[ticks.length - 1];
  const Y = v => m.t + ih * (1 - Math.max(0, v) / y1);
  const bw = Math.max(3, Math.min(24, (band * 0.72 - 2) / 2));
  const lstep = Math.max(1, Math.ceil(40 / band));
  let g = "";
  for (const t of ticks) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="${t === 0 ? "var(--axis)" : "var(--grid)"}" stroke-width="1"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end">${esc(moneyC(t))}</text>`;
  rows.forEach((r, i) => {
    const cx = m.l + band * i + band / 2, x0 = cx - bw - 1;
    if (r.ym === opt.selected) g += `<rect x="${m.l + band * i + 1}" y="${m.t}" width="${band - 2}" height="${ih}" rx="6" fill="var(--accent-wash)"/>`;
    g += `<path d="${colPath(x0, Y(r.income), bw, Y(0) - Y(r.income), 4)}" fill="var(--s1)"/>`;
    g += `<path d="${colPath(cx + 1, Y(r.expense), bw, Y(0) - Y(r.expense), 4)}" fill="var(--s2)"/>`;
    if ((n - 1 - i) % lstep === 0) g += `<text x="${cx}" y="${H - 6}" text-anchor="middle" ${r.ym === opt.selected ? 'style="fill:var(--ink);font-weight:700"' : ""}>${esc(monthShort(r.ym))}</text>`;
    g += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="0" width="${band}" height="${H}" fill="transparent" ${opt.onPick ? 'style="cursor:pointer"' : ""}/>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Income and spending by month">${g}</svg>`;
  el.querySelectorAll(".hit").forEach(h => {
    const r = rows[+h.dataset.i];
    h.addEventListener("pointermove", ev => {
      const net = r.income - r.expense;
      showTip(`<div class="h">${esc(monthName(r.ym))}</div>` + tipRow("var(--s1)", esc(money(r.income)), "Income") + tipRow("var(--s2)", esc(money(r.expense)), "Spending") +
        `<div class="r" style="border-top:1px solid var(--line);margin-top:4px;padding-top:2px"><i style="background:transparent"></i><b>${esc(signed(net).replace(/\.\d\d$/, ""))}</b><span>Saved${r.income > 0 ? " · " + pct(net / r.income) : ""}</span></div>`, ev);
    });
    h.addEventListener("pointerleave", hideTip);
    if (opt.onPick) h.addEventListener("click", () => { hideTip(); opt.onPick(r.ym); });
  });
}

function hbars(rows, total, cls = "") {
  if (!rows.length) return `<div class="empty small">Nothing here for this month.</div>`;
  const max = Math.max(...rows.map(r => r.v), 1);
  return `<div class="hbars">` + rows.map(r => {
    const c = catOf(r.name);
    return `<div class="hbar ${cls}" data-tip="${esc(JSON.stringify({ h: c.emoji + " " + c.name, v: money(r.v, true), s: total ? pct(r.v / total) + " of total" : "" }))}">
      <span class="nm">${esc(c.emoji)} ${esc(c.name)}</span><span class="tr"><b style="width:${Math.max(0.4, r.v / max * 100)}%"></b></span><span class="v">${esc(money(r.v))}</span></div>`;
  }).join("") + `</div>`;
}
document.addEventListener("pointermove", ev => {
  const b = ev.target.closest && ev.target.closest(".hbar[data-tip]");
  if (b) { const d = JSON.parse(b.dataset.tip); showTip(`<div class="h">${esc(d.h)}</div>` + tipRow(b.classList.contains("inc") ? "var(--good)" : "var(--s1)", esc(d.v), d.s), ev); }

function budgetTotals(ym) {
  const mm = M(ym); let budget = 0, spent = 0;
  for (const [cat, b] of Object.entries(S.budgets)) { if (!b || !CM[cat] || groupOf(cat) === "Income" || groupOf(cat) === "Transfers") continue; budget += b; spent += mm.cats[cat] || 0; }
  return { budget, spent };
}
function meterHtml(spent, budget) {
  const r = budget > 0 ? spent / budget : 0, cls = spent - budget >= 1 ? "over" : r >= 0.9 && budget - spent >= 1 ? "warn" : "";
  return `<div class="meter ${cls}" role="meter" aria-valuemin="0" aria-valuemax="${budget}" aria-valuenow="${Math.round(spent)}"><b style="width:${Math.min(100, Math.max(0, r * 100))}%"></b></div>`;
}
function budgetPill(spent, budget) {
  const left = budget - spent;
  if (Math.abs(left) < 1) return `<span class="pill good">✓ On budget</span>`;
  if (spent > budget) return `<span class="pill over">▲ ${esc(money(-left))} over</span>`;
  if (budget > 0 && spent / budget >= 0.9) return `<span class="pill warn">● ${esc(money(left))} left</span>`;
  return `<span class="pill ok">${esc(money(left))} left</span>`;
}
function spendRows(ym) {
  return Object.entries(M(ym).cats).filter(([c, v]) => groupOf(c) !== "Income" && v > 0.5).map(([name, v]) => ({ name, v })).sort((a, b) => b.v - a.v);
}
function incomeRows(ym) {

}

    <div style="min-width:0"><div class="t">${esc(t.desc)}</div><div class="s">${esc(c.name)} · ${compact ? esc(dayName(t.date, { month: "short", day: "numeric" })) : esc(acctName(t.account))}</div></div>

/* ---------- insights (rule-based, computed locally) ---------- */
function insights(ym) {
  const out = [], mm = M(ym), isCur = ym === CUR_MONTH;
  const frac = isCur ? (+TODAY.slice(8)) / daysIn(ym) : 1;
  if (!S.transactions.length) return out;
  if (isCur && frac < 1) {
    let flex = 0, fixed = 0;
    for (const [c, v] of Object.entries(mm.cats)) { const g = groupOf(c); if (g === "Everyday" || g === "Lifestyle") flex += v; else if (g !== "Income") fixed += v; }
    const proj = fixed + flex / Math.max(frac, 0.05);
    out.push(["nt", "→", `At this pace you'll spend about <b>${esc(money(proj))}</b> this month (${esc(money(mm.expense))} so far).`]);
  }
  const moves = [];
  for (const c of S.categories) {
    if (c.group !== "Everyday" && c.group !== "Lifestyle") continue;
    const avg = avgCat(c.name, ym); if (avg == null) continue;
    const cur = mm.cats[c.name] || 0, d = cur - avg * frac;
    if (Math.abs(d) >= 40) moves.push({ c, d, avg: avg * frac });
  }
  moves.sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
  for (const mv of moves.slice(0, 2)) {
    out.push([mv.d > 0 ? "up" : "dn", mv.d > 0 ? "▲" : "▼", `${esc(mv.c.name)} is <b>${esc(money(Math.abs(mv.d)))} ${mv.d > 0 ? "above" : "below"}</b> your 3-month average${isCur ? " for this point in the month" : ""}.`]);
  }
  const over = Object.entries(S.budgets).filter(([c, b]) => b > 0 && CM[c] && (mm.cats[c] || 0) > b);
  if (over.length) out.push(["up", "!", `${over.length} ${over.length === 1 ? "category is" : "categories are"} over budget: ${over.slice(0, 3).map(([c]) => esc(c)).join(", ")}${over.length > 3 ? "…" : ""}.`]);
  const subs = RECUR.filter(r => r.amount < 0 && r.category === "Subscriptions");
  if (subs.length) out.push(["nt", "↻", `Subscriptions cost <b>${esc(money(-sum(subs.map(s => s.monthly)), true))}</b> a month across ${subs.length} services.`]);
  const net = mm.income - mm.expense, goal = S.settings.savingsGoal;
  if (!isCur && goal > 0) out.push([net >= goal ? "dn" : "up", net >= goal ? "✓" : "✗", net >= goal ? `You beat your savings goal by ${esc(money(net - goal))}.` : `You saved ${esc(money(net))}, ${esc(money(goal - net))} short of your ${esc(money(goal))} goal.`]);
  return out;
}

const dlg = $("#dlg");
function openDlg(html, onSubmit) {
  dlg.innerHTML = `<form class="dlg" method="dialog">${html}</form>`;
  const form = dlg.firstChild;
  form.addEventListener("submit", e => { e.preventDefault(); const ok = onSubmit ? onSubmit(new FormData(form), e.submitter) : true; if (ok !== false) dlg.close(); });
  form.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => dlg.close()));
  if (!dlg.open) dlg.showModal();
  return form;
}
function askConfirm(title, body, okLabel, danger) {
  return new Promise(res => {
    let result = false;
    openDlg(`<h3>${esc(title)}</h3><p>${esc(body)}</p><div class="dlg-foot"><button type="button" class="btn" data-close>Cancel</button><button class="btn ${danger ? "danger" : "primary"}" value="ok">${esc(okLabel)}</button></div>`, () => { result = true; });
    dlg.addEventListener("close", () => res(result), { once: true });
  });
}
let toastT;
function toast(msg, actLabel, act) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${actLabel ? `<button type="button">${esc(actLabel)}</button>` : ""}`;
  t.hidden = false;
  if (actLabel) t.querySelector("button").onclick = () => { t.hidden = true; act(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, actLabel ? 8000 : 3500);
}
function acctOptions(sel) { return S.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? "selected" : ""}>${esc(a.name)}</option>`).join(""); }

function editTx(id) {
  const t = id ? S.transactions.find(x => x.id === id) : null;
  if (!t && !S.accounts.length) { toast("Add an account first."); location.hash = "#accounts"; return; }
  const d = t || { date: TODAY, desc: "", amount: "", category: "Uncategorized", account: S.accounts[0].id, notes: "" };
  const kind = t ? (t.amount > 0 ? "in" : "out") : "out";
  openDlg(`<h3>${t ? "Edit transaction" : "Add transaction"}</h3>
    <div class="fields">
      <label class="field full"><span>Merchant or description</span><input name="desc" id="f-desc" required value="${esc(d.desc)}"></label>
      <label class="field"><span>Amount</span><input name="amount" id="f-amt" type="number" step="0.01" min="0" required inputmode="decimal" value="${d.amount === "" ? "" : Math.abs(d.amount)}"></label>
      <label class="field"><span>Direction</span><select name="kind" id="f-kind"><option value="out" ${kind === "out" ? "selected" : ""}>Money out</option><option value="in" ${kind === "in" ? "selected" : ""}>Money in</option></select></label>
      <label class="field"><span>Date</span><input name="date" id="f-date" type="date" required value="${esc(d.date)}"></label>
      <label class="field"><span>Account</span><select name="account" id="f-acct">${acctOptions(d.account)}</select></label>
      <label class="field full"><span>Category</span><select name="category" id="f-cat">${catOptions(d.category)}</select></label>
      <label class="field full"><span>Notes</span><input name="notes" id="f-notes" value="${esc(d.notes || "")}"></label>
    </div>
    <div class="dlg-foot">${t ? `<button type="submit" class="btn danger" value="delete">Delete</button>` : ""}<span class="sp"></span><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" value="save">${t ? "Save" : "Add"}</button></div>`,
  (fd, sub) => {
    if (sub && sub.value === "delete") {
      const a = S.accounts.find(x => x.id === t.account); if (a && !a.snapshots) a.balance = round2(a.balance - t.amount);
      S.transactions = S.transactions.filter(x => x !== t); commit(); toast("Transaction deleted"); return;
    }
    const amt = round2((fd.get("kind") === "in" ? 1 : -1) * Math.abs(parseFloat(fd.get("amount")) || 0));
    const next = { date: fd.get("date"), desc: fd.get("desc").trim(), amount: amt, category: fd.get("category"), account: fd.get("account"), notes: fd.get("notes").trim() };
    if (t) {
      const oldA = S.accounts.find(x => x.id === t.account); if (oldA && !oldA.snapshots) oldA.balance = round2(oldA.balance - t.amount);
      Object.assign(t, next);
    } else S.transactions.push({ id: uid(), ...next });
    const na = S.accounts.find(x => x.id === next.account); if (na && !na.snapshots) na.balance = round2(na.balance + amt);
    commit(); toast(t ? "Saved" : "Transaction added");
  });

/* ---------- CSV import ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const delim = [",", ";", "\t", "|"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length) { row.push(f); rows.push(row); }
  return rows.map(r => r.map(x => x.trim())).filter(r => r.some(x => x !== ""));
}
function parseAmount(s) {
  s = String(s || "").trim(); if (!s) return null;
  let neg = /^\(.*\)$/.test(s) || /-/.test(s) || /\bDR\b/i.test(s);
  s = s.replace(/[^\d.,]/g, "");
  if (!s) return null;
  if (/,\d{1,2}$/.test(s) && !/\.\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", "."); else s = s.replace(/,/g, "");
  const v = parseFloat(s); if (!isFinite(v)) return null;
  return neg ? -v : v;
}
function detectDateOrder(samples) {
  const ss = samples.filter(Boolean).map(s => s.split(/[ T]/)[0]);
  if (ss.every(s => /^\d{4}[-/.]\d{1,2}[-/.]\d{1,2}$/.test(s))) return "ymd";
  for (const s of ss) { const p = s.split(/[\/.\-]/).map(Number); if (p[0] > 12 && p[0] <= 31) return "dmy"; }
  return "mdy";
}
function parseDate(s, order) {
  s = String(s || "").trim(); if (!s) return null;
  const head = s.split(/[ T]/)[0], p = head.split(/[\/.\-]/);
  let y, m, d;
  if (p.length === 3 && p.every(x => /^\d+$/.test(x))) {
    if (p[0].length === 4) [y, m, d] = p.map(Number);
    else if (order === "dmy") [d, m, y] = p.map(Number);
    else [m, d, y] = p.map(Number);
    if (y < 100) y += 2000;
  } else { const t = new Date(s); if (isNaN(t)) return null; y = t.getFullYear(); m = t.getMonth() + 1; d = t.getDate(); }
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31 && y > 1970)) return null;
  return y + "-" + pad(m) + "-" + pad(d);
}
function guessColumns(header) {
  const find = (...res) => { for (const re of res) { const i = header.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; };
  const amount = find(/^amount$/i, /^(transaction )?amount/i, /amount(?!.*(debit|credit))/i, /^value$/i);
  return {
    date: find(/^(transaction|trans\.?) ?date/i, /^date$/i, /date/i, /posted/i),
    desc: find(/^description$/i, /description/i, /payee/i, /merchant/i, /^name$/i, /memo|details|narrative/i),
    amount,
    debit: amount >= 0 ? -1 : find(/debit|withdraw|money out|paid out/i),
    credit: amount >= 0 ? -1 : find(/credit(?! ?card)|deposit|money in|paid in/i),
    category: find(/category/i)
  };
}

function importRows() {
  const v = id => +$(id).value, order = $("#i-order").value, flip = $("#i-flip").checked;
  const di = v("#i-date"), de = v("#i-desc"), ai = v("#i-amt"), bi = v("#i-deb"), ci = v("#i-cred"), ki = v("#i-cat");
  const catByLower = {}; for (const c of S.categories) catByLower[c.name.toLowerCase()] = c.name;
  return IMP.data.map(r => {
    const date = parseDate(r[di], order), desc = (r[de] || "").replace(/\s+/g, " ").trim();
    let amount = null;
    if (ai >= 0) { amount = parseAmount(r[ai]); if (amount != null && flip) amount = -amount; }
    else if (bi >= 0 || ci >= 0) { const o = parseAmount(r[bi]) || 0, i = parseAmount(r[ci]) || 0; amount = Math.abs(i) - Math.abs(o); if (!r[bi] && !r[ci]) amount = null; }
    if (!date || amount == null || !desc) return { ok: false, raw: r };
    amount = round2(amount);
    const given = ki >= 0 ? catByLower[(r[ki] || "").toLowerCase()] : null;
    return { ok: true, date, desc, amount, category: given || categorize(desc, amount) };
  });
}
function doImport() {
  const rows = importRows().filter(r => r.ok);
  if (!rows.length) return false;
  if (S.settings.demo) { const keep = S.settings; S = emptyState(); S.settings = { ...keep, demo: false, savingsGoal: 0 }; rebuild(); }
  let acctId = $("#i-acct").value, acct;
  const balRaw = $("#i-bal").value;
  if (acctId === "__new" || !S.accounts.some(a => a.id === acctId)) {
    const type = $("#i-type").value;
    acct = { id: uid(), name: $("#i-newname").value.trim() || "Imported account", type, balance: 0 };
    S.accounts.push(acct); acctId = acct.id;
  } else acct = S.accounts.find(a => a.id === acctId);
  const seen = {};
  const keyOf = t => t.date + "|" + t.amount.toFixed(2) + "|" + merchantKey(t.desc);
  for (const t of S.transactions) if (t.account === acctId) { const k = keyOf(t); seen[k] = (seen[k] || 0) + 1; }
  let added = 0, skipped = 0, flow = 0;
  for (const r of rows) {
    const k = keyOf(r);
    if (seen[k] > 0) { seen[k]--; skipped++; continue; }
    S.transactions.push({ id: uid(), date: r.date, desc: r.desc, amount: r.amount, category: r.category, account: acctId }); added++; flow += r.amount;
  }
  if (balRaw !== "") { const b = Math.abs(parseFloat(balRaw) || 0); acct.balance = round2(isLiability(acct) ? -b : b); }
  else acct.balance = round2((acct.balance || 0) + flow);
  if (acct.snapshots) delete acct.snapshots;
  const last = rows.map(r => r.date).sort().pop(); if (last) { UI.month = last.slice(0, 7); UI.cfMonth = UI.month; }
  commit();
  const unc = rows.filter(r => r.category === "Uncategorized").length;
  toast(`Imported ${added.toLocaleString()} transactions${skipped ? `, skipped ${skipped} duplicates` : ""}.${unc ? ` ${unc} need a category.` : ""}`, unc ? "Review" : null, () => { UI.tx = { q: "", account: "", category: "Uncategorized", month: "", limit: 150 }; location.hash = "#transactions"; render(); });
}

/* ---------- export / backup ---------- */
function download(name, text, type) {
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch (e) { showText(name, text); }
}
function showText(title, text) {
  const form = openDlg(`<h3>${esc(title)}</h3><p>Select all and copy.</p><textarea class="note" id="txtout" style="min-height:260px;font:12.5px/1.45 ui-monospace,Menlo,monospace" readonly>${esc(text)}</textarea><div class="dlg-foot"><button class="btn primary">Done</button></div>`);
  const ta = form.querySelector("#txtout"); ta.focus(); ta.select();
}
function copyText(text, label) {
  const fallback = () => showText(label, text);
  try { navigator.clipboard.writeText(text).then(() => toast(label + " copied"), fallback); } catch (e) { fallback(); }
}
function csvEscape(v) { v = String(v ?? ""); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  const rows = [["Date", "Description", "Amount", "Category", "Account", "Notes"]].concat([...S.transactions].sort((a, b) => a.date < b.date ? 1 : -1).map(t => [t.date, t.desc, t.amount.toFixed(2), t.category, acctName(t.account), t.notes || ""]));
  download(`kakeibo-transactions-${TODAY}.csv`, rows.map(r => r.map(csvEscape).join(",")).join("\n"), "text/csv");
}
function restoreBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const st = JSON.parse(r.result);
      if (!st || !Array.isArray(st.transactions) || !Array.isArray(st.accounts)) throw new Error("shape");
      askConfirm("Restore this backup?", `It has ${st.accounts.length} accounts and ${st.transactions.length.toLocaleString()} transactions, and replaces everything here.`, "Restore").then(ok => {
        if (!ok) return; S = normalize(st); setFormatters(); commit(); toast("Backup restored");
      });
    } catch (e) { toast("That file isn't a Kakeibo backup."); }
  };
  r.readAsText(file);
}
function summaryText() {
  const lines = [], ym = UI.month, months = [addMonths(ym, -2), addMonths(ym, -1), ym];
  lines.push(`# Personal finance summary (as of ${TODAY}, currency ${S.settings.currency})`, "");
  lines.push(`Net worth: ${money(netWorth())}`);
  for (const a of S.accounts) lines.push(`- ${a.name} (${ACCT_TYPES[a.type] || a.type}): ${money(a.balance, true)}`);
  lines.push("", "## Cash flow", "| Month | Income | Spending | Saved |", "|---|---|---|---|");
  for (const m of months) { const x = M(m); lines.push(`| ${monthName(m)}${m === CUR_MONTH ? " (in progress)" : ""} | ${money(x.income)} | ${money(x.expense)} | ${money(x.income - x.expense)} |`); }
  lines.push("", "## Spending by category", `| Category | ${months.map(monthShort).join(" | ")} | Budget |`, "|---|" + months.map(() => "---|").join("") + "---|");
  const cats = S.categories.filter(c => c.group !== "Income" && c.group !== "Transfers" && months.some(m => (M(m).cats[c.name] || 0) > 0.5));
  for (const c of cats) lines.push(`| ${c.name} | ${months.map(m => money(M(m).cats[c.name] || 0)).join(" | ")} | ${S.budgets[c.name] ? money(S.budgets[c.name]) : "—"} |`);
  const rec = RECUR.filter(r => r.amount < 0);
  if (rec.length) { lines.push("", "## Recurring charges"); for (const r of rec) lines.push(`- ${r.name}: ${money(-r.amount, true)} ${r.freq.label.toLowerCase()} (${r.category})`); }
  if (S.settings.savingsGoal) lines.push("", `Monthly savings goal: ${money(S.settings.savingsGoal)}`);
  if (S.notes[ym]) lines.push("", `My notes for ${monthName(ym)}: ${S.notes[ym]}`);
  lines.push("", "Questions I'd like help with: where can I cut back, am I on track with my savings goal, and does anything look unusual?");
  return lines.join("\n");
}

  reset: () => askConfirm("Delete all data?", "Every account, transaction, budget and note in this browser will be deleted. Download a backup first if you might want it.", "Delete everything", true).then(ok => {
    if (!ok) return; S = emptyState(); setFormatters(); commit(); toast("All data deleted");
  })
};
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b, e); });

let noteT;
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.change === "note") { clearTimeout(noteT); noteT = setTimeout(() => { const v = el.value.trim(); if (v) S.notes[el.dataset.ym] = v; else delete S.notes[el.dataset.ym]; save(); }, 400); }
});
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset.change; if (!k) return;
  if (k === "budget") { const v = Math.max(0, parseFloat(el.value) || 0); if (v) S.budgets[el.dataset.cat] = v; else delete S.budgets[el.dataset.cat]; commit(); }
  else if (k === "goal") { S.settings.savingsGoal = Math.max(0, parseFloat(el.value) || 0); commit(); }
  else if (k === "currency") { S.settings.currency = el.value; setFormatters(); commit(); }
  else if (k === "tx-cat") {
    const t = S.transactions.find(x => x.id === el.dataset.id); if (!t) return;
    t.category = el.value; save(); rebuild();
    const key = merchantKey(t.desc);
    const others = S.transactions.filter(x => x !== t && merchantKey(x.desc) === key && x.category !== t.category);
    const cat = t.category;
    if (others.length) toast(`Recategorized. ${others.length} more from ${titleCase(key)}.`, "Apply to all", () => {
      for (const x of others) x.category = cat;
      S.rules = S.rules.filter(r => r.key !== key); S.rules.push({ key, category: cat }); commit(); toast(`Updated ${others.length} and saved a rule`);
    });
    else { S.rules = S.rules.filter(r => r.key !== key); S.rules.push({ key, category: cat }); save(); toast("Recategorized"); }
  }
});

/* ---------- boot ---------- */
S = load();
if (S) S = normalize(S); else { S = sampleState(); save(); }
setFormatters();
render();
</script>
</body>
</html>
