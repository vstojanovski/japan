:root { color-scheme: light dark }
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent }
body {

}
html { touch-action: manipulation }
.wrap { max-width: 620px; margin: 0 auto; padding: 18px 18px 0 }

.datebar { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:2px }
.dow { font-size: 15px; font-weight: 700; letter-spacing:.08em; text-transform:uppercase; color:#b23a2e }
.date { font-size: 15px; color:#6f6862 }
select#jump {
  font:inherit; font-size:15px; color:#6f6862; margin-left:auto; text-align:right;
  border:none; background:transparent; padding:2px 0; -webkit-appearance:none; appearance:none;
  max-width:62%; direction:rtl;
}

h1 { font-size: 27px; line-height:1.2; font-weight: 700; margin: 6px 0 16px; letter-spacing:-.01em }

.anchor { background:#fff3e6; border-left:4px solid #e07b2a; border-radius:0 8px 8px 0; padding:11px 14px; margin-bottom:16px }
.anchor .lbl { font-size:11px; font-weight:800; letter-spacing:.12em; color:#b35c14; text-transform:uppercase; display:block; margin-bottom:3px }
.anchor .txt { font-size:16px; font-weight:600 }

ol.plan { list-style:none; counter-reset:s }
ol.plan li { counter-increment:s; position:relative; padding:12px 0 12px 34px; border-bottom:1px solid #ece7e0; font-size:16.5px }
ol.plan li:last-child { border-bottom:none }
ol.plan li::before {
  content: counter(s); position:absolute; left:0; top:13px;
  width:22px; height:22px; border-radius:50%; background:#e8e3dc; color:#6b6560;
  font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
}
ol.plan li.fix::before { background:#e07b2a; color:#fff }
ol.plan li.opt::before { background:transparent; border:1.5px dashed #c3bbb0; color:#a8a099 }
ol.plan li.opt { color:#6f6862 }
ol.plan li .t { display:inline-block; font-variant-numeric:tabular-nums; font-weight:700; color:#b23a2e; margin-right:7px }
ol.plan li .n { display:block; font-size:14px; color:#635d57; margin-top:3px }

a.go { color:#14548c; text-decoration:none; border-bottom:1px solid #bcd4e8; padding-bottom:1px }
a.go:active { background:#e3eef7 }
li.opt a.go { color:#5c7d99; border-bottom-color:#d3dee7 }

.m { margin-left:6px; font-size:14px; vertical-align:-1px }
.un { display:inline-block; margin-left:6px; font-size:9.5px; font-weight:800; letter-spacing:.07em;
  color:#2c6b8f; background:#e4eef5; border-radius:4px; padding:2px 5px; vertical-align:2px }
.q { display:inline-block; margin-left:6px; font-size:11px; font-weight:800;
  color:#9c7d3a; background:#f7f0de; border-radius:4px; padding:1px 6px; vertical-align:1px }

.drop { margin-top:16px; font-size:13.5px; color:#635d57 }
.drop b { color:#4a4540; font-weight:700 }
.ship { margin-top:14px; padding:11px 14px; background:#eaf2ee; border-left:4px solid #3e8c68; border-radius:0 8px 8px 0; font-size:15px; font-weight:600; color:#215943 }
.note { margin-top:14px; font-size:14.5px; color:#5a5450; line-height:1.55 }
.hint { margin-top:20px; font-size:12.5px; color:#77706a; text-align:center; line-height:1.6 }
.hint b { color:#5a5450 }
.off { display:none; margin-top:14px; padding:9px 14px; background:#f2efeb; border-radius:8px;
  font-size:13.5px; color:#635d57; text-align:center }
body.offline .off { display:block }

nav { position:fixed; bottom:0; left:0; right:0; background:#fffdfb; border-top:1px solid #e4ded6;
  padding:11px 14px calc(11px + env(safe-area-inset-bottom)); display:flex; gap:9px; max-width:620px; margin:0 auto }
nav button { touch-action: manipulation; flex:1; font:inherit; font-size:15px; font-weight:600; padding:12px 8px;
  border:1px solid #ddd6cd; background:#fff; color:#3a3530; border-radius:9px; cursor:pointer }
nav button:active { background:#f0ebe4 }
nav button.now { flex:1.5; background:#b23a2e; color:#fff; border-color:#b23a2e }
nav button:disabled { opacity:.32 }

.tonight { margin-top:18px; padding:12px 14px; background:#fff; border:1px solid #e4ded6; border-radius:10px;
  display:flex; align-items:center; gap:10px; font-size:15px }
.tonight .ic { font-size:18px }
.tonight .lb { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#8a8580; display:block }
.tonight a { color:#14548c; text-decoration:none; font-weight:600 }
.sos { margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center }
.sos a { font-size:12.5px; color:#8b2f25; background:#fbecea; border-radius:14px; padding:5px 11px; text-decoration:none; font-weight:600 }
.pre { text-align:center; padding:36px 0 16px }
.pre .big { font-size:52px; font-weight:800; letter-spacing:-.03em; color:#b23a2e; line-height:1 }
.pre .cap { font-size:15px; color:#8a8580; margin-top:6px }
.tmrw { margin-top:12px; padding:11px 14px; border-radius:10px; background:#f2efeb; font-size:14.5px; color:#4a4540; cursor:pointer }
.tmrw .lb { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#8a8580; display:block; margin-bottom:2px }
.tmrw b { font-weight:700 }
.tmrw .lb { display:flex } .pace { margin-left:auto; letter-spacing:.04em }
.pace.early { color:#b2452c } .pace.easy { color:#3b8a5c }

  .off { background:#221e19; color:#b3a99e }

  .tonight .lb, .tmrw .lb { color:#8f857a }
  .tonight a { color:#8fbde6 }
  .tmrw { background:#221e19; color:#d6cdc3 }
  .sos a { color:#f2a79c; background:#3a1d1a }
  .pace.early { color:#f3a58c } .pace.easy { color:#9fd6b9 }
  nav { background:#1c1814; border-top-color:#2e2822 }

  nav button:active { background:#352e26 }
  nav button.now { background:#b23a2e; border-color:#b23a2e; color:#fff }
  .pre .big { color:#f0826f } .pre .cap { color:#a89e93 }
}

const app = document.getElementById('app');
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const EM = { walk:"🚶", metro:"🚇", train:"🚃", shin:"🚄", bus:"🚌", taxi:"🚕",
             tram:"🚋", ferry:"⛴️", rope:"🚡", air:"✈️" };
let i = 0;

function todayStr(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
function pick(){
  const t = todayStr();
  let idx = D.findIndex(x => x.d === t);
  if (idx >= 0) return idx;
  idx = D.findIndex(x => x.d > t);
  return idx >= 0 ? idx : D.length - 1;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

// Before the trip starts, "directions from here" would route from Skopje to Japan.
// So until Nov 6 a tap just shows the place on the map; from Nov 6 it gives directions.
const TRIP_START = "2026-11-06";
function inJapan(){ return todayStr() >= TRIP_START; }
function mapUrl(q, mode){
  if (!inJapan())
    return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
  const tm = (mode === "walk") ? "walking" : "transit";
  return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(q)+"&travelmode="+tm;
}

// Where you sleep each night — tap for directions home
const HOTELS = [
  ["2026-11-07","2026-11-10","Toyoko Inn Tokyo Shinjuku Kabukicho"],
  ["2026-11-11","2026-11-12","Hotel Resol Trinity Kanazawa"],
  ["2026-11-13","2026-11-16","Daiwa Roynet Hotel Kyoto Hachijoguchi"],
  ["2026-11-17","2026-11-21","Via Inn Prime Shinsaibashi Yotsubashi"],
  ["2026-11-22","2026-11-23","Hotel Vista Hiroshima"],
  ["2026-11-24","2026-11-25","Yokohama Tokyu REI Hotel"],
  ["2026-11-26","2026-11-27","Sotetsu Fresa Inn Tokyo Kanda"]
];
// How tomorrow starts — decides how late tonight can run
const EARLY = {
  "2026-11-12":"bus to Shirakawa-go around 08:00",
  "2026-11-14":"bamboo grove by 07:30",
  "2026-11-16":"Fushimi Inari at 07:00",
  "2026-11-20":"longest day of the trip",
  "2026-11-23":"leave the hotel at 07:00",
  "2026-11-24":"check out, 09:00 train",
  "2026-11-27":"Tsukiji at 08:00"
};
function hotelFor(d){ const h = HOTELS.find(r => d >= r[0] && d <= r[1]); return h ? h[2] : null; }

function label(x, i){
  const [,m,dd] = x.d.split("-");
  const dt = parseInt(dd)+" "+MON[parseInt(m)-1];
  return x.n ? ("Day "+x.n+" · "+dt+" · "+x.city) : (dt+" · "+x.city);
}
function buildJump(){
  const trip = inJapan();
  return '<select id="jump" aria-label="Jump to a day">' + D.map(function(x,k){
    if (trip && !x.n && k !== i) return '';   // prep days drop out once you've landed
    return '<option value="'+k+'"'+(k===i?' selected':'')+'>'+esc(label(x,k))+'</option>';
  }).join('') + '</select>';
}

function render(){
  const x = D[i];
  const [y,m,dd] = x.d.split("-");
  const t = todayStr();
  const isToday = x.d === t;

  let h = '<div class="datebar">';
  h += '<span class="dow">'+x.dow+(isToday?' · TODAY':'')+'</span>';
  h += '<span class="date">'+parseInt(dd)+' '+MON[parseInt(m)-1]+'</span>';
  h += buildJump();
  h += '</div><h1>'+esc(x.t)+'</h1>';

  if (x.anchor) h += '<div class="anchor"><span class="lbl">Anchor</span><span class="txt">'+esc(x.anchor)+'</span></div>';
  if (x.ship) h += '<div class="ship">'+esc(x.ship)+'</div>';

  let anyMap = false;
  h += '<ol class="plan">';
  x.items.forEach(function(it, k){
    const flags = it[5] || "";
    const cls = [it[0] ? "fix" : "", flags.indexOf("q") >= 0 ? "opt" : ""].filter(Boolean).join(" ");
    h += '<li'+(cls?' class="'+cls+'"':'')+'>';
    if (it[0]) h += '<span class="t">'+esc(it[0])+'</span>';
    if (it[3]) {
      const web = /^https?:\/\//.test(it[3]);   // booking site, not a place
      if (!web) anyMap = true;
      h += '<a class="go" href="'+esc(web ? it[3] : mapUrl(it[3], it[4]))+'" target="_blank" rel="noopener">'+esc(it[1])+'</a>';
    } else {
      h += esc(it[1]);
    }
    if (it[4] && EM[it[4]]) h += '<span class="m">'+EM[it[4]]+'</span>';
    if (flags.indexOf("u") >= 0) h += '<span class="un">UNESCO</span>';
    if (flags.indexOf("q") >= 0) h += '<span class="q">?</span>';
    if (it[2]) h += '<span class="n">'+esc(it[2])+'</span>';
    h += '</li>';
  });
  h += '</ol>';

  if (x.drop) h += '<div class="drop"><b>Drop first:</b> '+esc(x.drop)+'</div>';
  if (x.note) h += '<div class="note">'+esc(x.note)+'</div>';
  const hotel = hotelFor(x.d);
  if (hotel) h += '<div class="tonight"><span class="ic">🛏️</span><span><span class="lb">Tonight</span>'
    + '<a href="'+mapUrl(hotel, "transit")+'" target="_blank" rel="noopener">'+esc(hotel)+'</a></span></div>';
  // Peek at tomorrow — for planning the evening, not the clock
  if (hotelFor(x.d) && i < D.length-1 && D[i+1].n) {
    const tm = D[i+1];
    const first = tm.items.find(it => it[0]) || tm.items[0];
    let lead = tm.anchor || (first ? ((first[0] ? first[0]+' ' : '') + first[1]) : '');
    const extras = [];
    if (!/Heattech/i.test(lead) && tm.items.some(it => /Heattech/i.test(it[1]))) extras.push('Heattech');
    if (tm.ship) extras.push('luggage to ship');
    const pace = EARLY[tm.d] ? '<span class="pace early">🌅 Early start</span>' : '<span class="pace easy">🍻 Easy morning</span>';
    h += '<div class="tmrw" id="tmrw"><span class="lb">Tomorrow · '+esc(tm.city)+pace+'</span><b>'+esc(tm.t)+'</b>'
      + (lead ? ' — '+esc(lead) : '') + (extras.length ? ' · '+esc(extras.join(' · ')) : '') + '</div>';
  }
  h += '<div class="off">No signal — showing the saved copy. Map links need a connection.</div>';
  if (anyMap) h += '<div class="hint">'
    + (inJapan() ? 'Tap a place for <b>directions from where you are</b>'
                 : 'Tap a place to see it on the map. From <b>6 Nov</b> the same tap gives directions from where you are')
    + '<br>🚶 walk · 🚇 metro · 🚃 train · 🚄 shinkansen · 🚋 tram · 🚌 bus · 🚕 taxi · ⛴️ ferry · 🚡 ropeway</div>';
  if (x.n) h += '<div class="sos"><a href="tel:110">🚓 Police 110</a><a href="tel:119">🚑 Ambulance · Fire 119</a>'
    + '<a href="tel:+815038162787">☎️ Visitor Hotline 24h, English</a></div>';

  if (x.d > t && i === pick()) {
    const days = Math.round((new Date(x.d) - new Date(t)) / 86400000);
    if (days > 0) h = '<div class="pre"><div class="big">'+days+'</div><div class="cap">day'+(days===1?'':'s')+' until this</div></div>' + h;
  }

  app.innerHTML = h;
  document.getElementById('jump').onchange = function(){ i = +this.value; render(); };
  const tw = document.getElementById('tmrw'); if (tw) tw.onclick = function(){ i++; render(); };
  document.getElementById('prev').disabled = (i === 0);
  document.getElementById('next').disabled = (i === D.length - 1);
  document.getElementById('now').disabled = (i === pick());
  window.scrollTo(0,0);
}

document.getElementById('prev').onclick = function(){ if(i>0){i--;render();} };
document.getElementById('next').onclick = function(){ if(i<D.length-1){i++;render();} };
document.getElementById('now').onclick = function(){ i = pick(); render(); };

function netState(){ document.body.classList.toggle('offline', !navigator.onLine); }
window.addEventListener('online', netState);
window.addEventListener('offline', netState);
netState();

// Re-check the date when the app is resumed from the background, so a home-screen
// icon left open overnight still lands on the right day.
let lastDay = todayStr();
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && todayStr() !== lastDay) { lastDay = todayStr(); i = pick(); render(); }
});

// Swipe left/right to change day
let sx = null, sy = null;
document.addEventListener('touchstart', function(e){
  if (e.target.closest('select, nav')) { sx = null; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  sx = null;
  if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  if (dx < 0 && i < D.length-1) { i++; render(); }
  else if (dx > 0 && i > 0) { i--; render(); }
}, {passive:true});

if ('serviceWorker' in navigator)
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });

i = pick();
render();
</script>
